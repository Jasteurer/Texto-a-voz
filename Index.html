<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Registro por Voz</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;700;800&display=swap');

:root {
  --bg: #07090f;
  --s1: #0d1117;
  --s2: #111827;
  --s3: #1a2235;
  --accent: #00e5ff;
  --green: #00ff88;
  --orange: #ff6b35;
  --red: #ff3b5c;
  --text: #e2e8f0;
  --muted: #4a5568;
  --border: rgba(0,229,255,0.12);
  --r: 14px;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  min-height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(0,229,255,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,229,255,0.025) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none; z-index: 0;
}

.app {
  position: relative; z-index: 1;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px 14px 100px;
}

/* HEADER */
.hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 0 18px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 18px;
}
.hdr-left { display: flex; align-items: center; gap: 10px; }
.hdr-icon {
  width: 38px; height: 38px;
  background: linear-gradient(135deg, var(--accent), #0066ff);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.hdr-title { font-size: 18px; font-weight: 800; letter-spacing: -0.5px; }
.hdr-title span { color: var(--accent); }

.cfg-btn {
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 8px; padding: 7px 14px;
  color: var(--muted); font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: 'Syne', sans-serif;
  transition: all .2s;
}
.cfg-btn:active { background: var(--s3); color: var(--text); }

/* CONFIG DRAWER */
.config-drawer {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r);
  margin-bottom: 16px; overflow: hidden;
  max-height: 0; opacity: 0;
  transition: max-height .35s ease, opacity .3s ease, padding .3s ease;
  padding: 0 16px;
}
.config-drawer.open { max-height: 500px; opacity: 1; padding: 16px; }

.cfg-row {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px;
}
.cfg-label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
.cfg-input {
  width: 64px; background: var(--s3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 7px;
  font-family: 'Share Tech Mono', monospace; font-size: 16px; text-align: center;
}
.cfg-input:focus { outline: none; border-color: var(--accent); }

.lang-sel {
  background: var(--s3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 7px 10px;
  font-family: 'Syne', sans-serif; font-size: 13px; cursor: pointer;
}

.fn-label { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .5px; display: block; margin-bottom: 8px; }
.fn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.fn-inp {
  background: var(--s3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); padding: 7px 10px;
  font-family: 'Syne', sans-serif; font-size: 13px; width: 100%;
}
.fn-inp:focus { outline: none; border-color: var(--accent); }

.apply-btn {
  width: 100%; margin-top: 14px;
  background: var(--accent); color: #000;
  border: none; border-radius: 8px; padding: 11px;
  font-family: 'Syne', sans-serif; font-weight: 800; font-size: 14px;
  cursor: pointer; letter-spacing: .3px;
}
.apply-btn:active { opacity: .85; }

/* MIC SECTION */
.mic-section {
  display: flex; flex-direction: column; align-items: center;
  gap: 14px; padding: 20px 0 16px;
}

.mic-wrap { position: relative; width: 110px; height: 110px; display: flex; align-items: center; justify-content: center; }

.ring-svg {
  position: absolute; inset: 0;
  opacity: 0; transition: opacity .3s;
  animation: spin 3s linear infinite;
}
.ring-svg.on { opacity: 1; }
@keyframes spin { to { transform: rotate(360deg); } }

.mic-btn {
  width: 92px; height: 92px; border-radius: 50%;
  border: 2px solid var(--border);
  background: radial-gradient(circle at 40% 35%, #1a3050, #0a1525);
  display: flex; align-items: center; justify-content: center;
  font-size: 38px; cursor: pointer; position: relative; z-index: 1;
  box-shadow: 0 8px 32px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.05);
  transition: transform .15s;
  -webkit-user-select: none; user-select: none;
}
.mic-btn:active { transform: scale(.93); }
.mic-btn.on {
  border-color: var(--accent);
  animation: mpulse 1.5s ease-in-out infinite;
}
@keyframes mpulse {
  0%   { box-shadow: 0 0 0 0 rgba(0,229,255,.45); }
  70%  { box-shadow: 0 0 0 24px rgba(0,229,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,229,255,0); }
}

.mic-lbl {
  font-size: 11px; font-weight: 700; text-transform: uppercase;
  letter-spacing: 1.5px; color: var(--muted); transition: color .2s;
}
.mic-lbl.on { color: var(--accent); }

/* TRANSCRIPT */
.tr-box {
  width: 100%; background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px;
}
.box-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
.tr-text {
  font-family: 'Share Tech Mono', monospace; font-size: 16px;
  color: var(--accent); min-height: 24px; word-break: break-word; line-height: 1.5;
}

/* CHIPS */
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
.chip {
  padding: 5px 13px; border-radius: 20px; font-size: 11px; font-weight: 700;
  border: 1px solid transparent; background: var(--s2); color: var(--muted);
  transition: all .2s; text-transform: uppercase; letter-spacing: .5px;
}
.chip.active { background: rgba(0,229,255,.12); border-color: var(--accent); color: var(--accent); }
.chip.done   { background: rgba(0,255,136,.08); border-color: var(--green); color: var(--green); }

/* PREVIEW */
.preview-box {
  width: 100%; background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 12px;
}
.prev-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.prev-pos { font-family: 'Share Tech Mono', monospace; font-size: 14px; color: var(--accent); font-weight: 700; }

.frows { display: flex; flex-direction: column; gap: 4px; }
.frow {
  display: flex; align-items: center; gap: 8px;
  padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04);
}
.frow:last-child { border: none; }
.fidx { font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--muted); width: 18px; text-align: right; flex-shrink: 0; }
.fnm  { font-size: 12px; color: var(--muted); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fval { font-family: 'Share Tech Mono', monospace; font-size: 15px; color: var(--text); min-width: 55px; text-align: right; flex-shrink: 0; }
.fval.filled { color: var(--green); }
.fval.cur    { color: var(--accent); font-weight: 700; }
.fval.empty  { color: var(--muted); font-size: 11px; }

/* ACTIONS */
.actions {
  display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  margin-bottom: 18px;
}
.act-btn {
  padding: 12px 8px; border-radius: 10px;
  border: 1px solid var(--border); cursor: pointer;
  font-family: 'Syne', sans-serif; font-size: 12px; font-weight: 700;
  transition: all .15s; display: flex; align-items: center;
  justify-content: center; gap: 5px; letter-spacing: .3px;
}
.act-btn:active { transform: scale(.96); }
.a-cancel { background: var(--s2); color: var(--orange); border-color: rgba(255,107,53,.25); }
.a-clear  { background: var(--s2); color: var(--red);    border-color: rgba(255,59,92,.25); }
.a-export {
  background: linear-gradient(135deg, #155e25, #0e4a1c);
  color: #fff; border-color: #1a7a30;
  grid-column: span 2; font-size: 14px; padding: 14px;
}
.a-export:active { opacity: .85; }

/* TABLE */
.tbl-section {
  background: var(--s1); border: 1px solid var(--border);
  border-radius: var(--r); overflow: hidden;
}
.tbl-hdr {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.tbl-hdr-title { font-size: 14px; font-weight: 800; }
.badge {
  font-family: 'Share Tech Mono', monospace; font-size: 12px;
  color: var(--muted); background: var(--s3); padding: 3px 10px; border-radius: 12px;
}

.tbl-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 12px; white-space: nowrap; }
thead th {
  background: var(--s2); padding: 9px 10px;
  text-align: left; font-size: 10px; font-weight: 700;
  text-transform: uppercase; letter-spacing: .5px; color: var(--muted);
  border-bottom: 1px solid var(--border);
}
thead th:first-child { color: var(--accent); }
tbody tr:nth-child(even) { background: rgba(0,229,255,.02); }
tbody td {
  padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,.04);
  font-family: 'Share Tech Mono', monospace;
}
tbody td:first-child { color: var(--accent); font-size: 11px; }
.nc { color: var(--green); }
.dc { text-align: center; }
.del-btn {
  background: none; border: none; cursor: pointer;
  color: var(--muted); font-size: 15px; padding: 2px 6px; border-radius: 4px;
}
.del-btn:active { color: var(--red); }

.empty-state { text-align: center; padding: 36px 20px; color: var(--muted); }
.empty-state .ei { font-size: 36px; margin-bottom: 10px; }
.empty-state p { font-size: 13px; line-height: 1.6; }
.empty-state strong { color: var(--accent); }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(90px);
  background: var(--s2); border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 22px;
  font-size: 14px; font-weight: 600; color: var(--text);
  box-shadow: 0 8px 32px rgba(0,0,0,.7);
  transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 999; pointer-events: none; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }
.toast.s { border-color: var(--green); color: var(--green); }
.toast.e { border-color: var(--red); color: var(--red); }
.toast.i { border-color: var(--accent); color: var(--accent); }
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-left">
      <div class="hdr-icon">🎙️</div>
      <div class="hdr-title">Registro <span>Voz</span></div>
    </div>
    <button class="cfg-btn" onclick="toggleCfg()">⚙️ Config</button>
  </div>

  <!-- CONFIG -->
  <div class="config-drawer" id="cfgDrawer">
    <div class="cfg-row">
      <span class="cfg-label">Registros por fila</span>
      <input class="cfg-input" type="number" id="cfgCount" value="10" min="1" max="20">
    </div>
    <div class="cfg-row">
      <span class="cfg-label">Idioma de voz</span>
      <select class="lang-sel" id="cfgLang">
        <option value="es-AR">🇦🇷 Español AR</option>
        <option value="es-ES">🇪🇸 Español ES</option>
        <option value="es-MX">🇲🇽 Español MX</option>
        <option value="en-US">🇺🇸 English US</option>
        <option value="pt-BR">🇧🇷 Português BR</option>
      </select>
    </div>
    <div>
      <span class="fn-label">Nombre de los campos</span>
      <div class="fn-grid" id="fnGrid"></div>
    </div>
    <button class="apply-btn" onclick="applyConfig()">✔ Aplicar configuración</button>
  </div>

  <!-- MIC -->
  <div class="mic-section">
    <div class="mic-wrap">
      <svg class="ring-svg" id="ringSvg" viewBox="0 0 110 110" width="110" height="110">
        <defs>
          <linearGradient id="rg" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#00e5ff"/>
            <stop offset="100%" stop-color="#0066ff"/>
          </linearGradient>
        </defs>
        <circle cx="55" cy="55" r="50" fill="none" stroke="url(#rg)" stroke-width="2.5"
          stroke-dasharray="35 280" stroke-linecap="round"/>
      </svg>
      <div class="mic-btn" id="micBtn" onclick="toggleListen()">🎙️</div>
    </div>
    <div class="mic-lbl" id="micLbl">TOCA PARA HABLAR</div>
  </div>

  <!-- TRANSCRIPT -->
  <div class="tr-box">
    <div class="box-label">Escuchado</div>
    <div class="tr-text" id="trText">—</div>
  </div>

  <!-- STATE CHIPS -->
  <div class="chips" id="chips"></div>

  <!-- PREVIEW -->
  <div class="preview-box">
    <div class="prev-hdr">
      <span class="box-label">Fila actual</span>
      <span class="prev-pos" id="prevPos">—</span>
    </div>
    <div class="frows" id="frows"></div>
  </div>

  <!-- ACTIONS -->
  <div class="actions">
    <button class="act-btn a-cancel" onclick="cancelRow()">↩ Cancelar fila</button>
    <button class="act-btn a-clear"  onclick="clearAll()">🗑 Limpiar todo</button>
    <button class="act-btn a-export" onclick="exportXLS()">📊 Exportar a Excel</button>
  </div>

  <!-- TABLE -->
  <div class="tbl-section">
    <div class="tbl-hdr">
      <span class="tbl-hdr-title">Registros guardados</span>
      <span class="badge" id="badge">0 filas</span>
    </div>
    <div class="tbl-wrap">
      <table id="tbl" style="display:none">
        <thead id="tHead"></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
    <div class="empty-state" id="emptyState">
      <div class="ei">🎤</div>
      <p>Di <strong>"posición"</strong> seguido del valor<br>para comenzar un nuevo registro</p>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ── CONFIG ──────────────────────────────────────────────────────
let cfg = {
  count: 10,
  lang: 'es-AR',
  names: []
};

// ── STATE ───────────────────────────────────────────────────────
let rows      = [];
let current   = null;   // {pos, fields:[]}
let fldIdx    = 0;
let appState  = 'idle'; // idle | field
let recog     = null;
let listening = false;

// ── BOOT ────────────────────────────────────────────────────────
function boot() {
  cfg.names = Array.from({length: cfg.count}, (_,i) => `R${i+1}`);
  buildFnGrid();
  renderChips();
  renderPreview();
  renderTable();
  initRecog();
  setTimeout(() => toast('Di "posición" + valor para comenzar', 'i'), 900);
}

// ── CONFIG ──────────────────────────────────────────────────────
function toggleCfg() {
  const d = document.getElementById('cfgDrawer');
  if (!d.classList.contains('open')) {
    document.getElementById('cfgCount').value = cfg.count;
    buildFnGrid();
    syncFnGrid();
  }
  d.classList.toggle('open');
}

function buildFnGrid() {
  const g = document.getElementById('fnGrid');
  g.innerHTML = '';
  for (let i = 0; i < cfg.count; i++) {
    const inp = document.createElement('input');
    inp.className = 'fn-inp';
    inp.placeholder = `Campo ${i+1}`;
    inp.value = cfg.names[i] || `R${i+1}`;
    inp.dataset.i = i;
    g.appendChild(inp);
  }
}

function syncFnGrid() {
  document.querySelectorAll('.fn-inp').forEach((inp,i) => {
    inp.value = cfg.names[i] || `R${i+1}`;
  });
}

function applyConfig() {
  const n = Math.min(20, Math.max(1, parseInt(document.getElementById('cfgCount').value)||10));
  cfg.count = n;
  cfg.lang = document.getElementById('cfgLang').value;
  const inputs = document.querySelectorAll('.fn-inp');
  cfg.names = [];
  for (let i=0; i<n; i++) cfg.names.push((inputs[i]?.value||'').trim() || `R${i+1}`);
  buildFnGrid();
  cancelRow(true);
  renderTable();
  if (recog) recog.lang = cfg.lang;
  toggleCfg();
  toast('Configuración aplicada ✓', 's');
}

// ── SPEECH ──────────────────────────────────────────────────────
function initRecog() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { toast('Reconocimiento de voz no disponible en este navegador', 'e'); return; }
  recog = new SR();
  recog.lang = cfg.lang;
  recog.continuous = false;
  recog.interimResults = true;

  recog.onresult = e => {
    let fin='', int='';
    for (const r of e.results) r.isFinal ? (fin += r[0].transcript) : (int += r[0].transcript);
    const heard = (fin||int).trim();
    document.getElementById('trText').textContent = heard || '—';
    if (fin) processVoice(fin.trim());
  };

  recog.onend = () => {
    if (listening) { try { recog.start(); } catch(e){} }
    else setMicUI(false);
  };

  recog.onerror = e => {
    if (e.error === 'no-speech' || e.error === 'aborted') return;
    toast('Error micrófono: ' + e.error, 'e');
  };
}

function toggleListen() {
  if (!recog) { initRecog(); if(!recog) return; }
  listening = !listening;
  if (listening) { recog.lang = cfg.lang; try { recog.start(); } catch(e){} setMicUI(true); }
  else { recog.abort(); setMicUI(false); }
}

function setMicUI(on) {
  document.getElementById('micBtn').className  = 'mic-btn' + (on?' on':'');
  document.getElementById('micBtn').textContent = on ? '🔴' : '🎙️';
  document.getElementById('ringSvg').className  = 'ring-svg' + (on?' on':'');
  const lbl = document.getElementById('micLbl');
  lbl.textContent = on ? 'ESCUCHANDO...' : 'TOCA PARA HABLAR';
  lbl.className   = 'mic-lbl' + (on?' on':'');
}

// ── VOICE LOGIC ─────────────────────────────────────────────────
function processVoice(raw) {
  const norm = raw.normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'')
    .replace(/[.,;:]/g,' ')
    .trim()
    .toLowerCase();

  // "posicion" → start new row
  if (/pos[ie]c[io]n/.test(norm)) {
    // Extract value AFTER the keyword
    const after = norm.replace(/.*pos[ie]c[io]n\s*/,'').trim();
    const val = numFromText(after) ?? after || extractNum(norm) ?? raw.replace(/posici[oó]n\s*/i,'').trim();
    startRow(val !== '' ? val : '?');
    return;
  }

  // "registra" → just a cue, wait for number
  if (/^registra$/.test(norm)) {
    if (!current) toast('Primero di "posición <valor>"', 'e');
    return;
  }

  // In field mode → capture value
  if (appState === 'field' && current) {
    const n = numFromText(norm);
    addField(n !== null ? n : raw.trim());
    return;
  }
}

function numFromText(t) {
  const spoken = {
    'cero':0,'un':1,'uno':1,'una':1,'dos':2,'tres':3,'cuatro':4,'cinco':5,
    'seis':6,'siete':7,'ocho':8,'nueve':9,'diez':10,'once':11,'doce':12,
    'trece':13,'catorce':14,'quince':15,'dieciseis':16,'diecisiete':17,
    'dieciocho':18,'diecinueve':19,'veinte':20,'treinta':30,'cuarenta':40,
    'cincuenta':50,'sesenta':60,'setenta':70,'ochenta':80,'noventa':90,
    'cien':100,'ciento':100,'doscientos':200,'trescientos':300,'cuatrocientos':400,
    'quinientos':500,'seiscientos':600,'setecientos':700,'ochocientos':800,
    'novecientos':900,'mil':1000,'millon':1000000
  };
  let s = t;
  for (const [w,v] of Object.entries(spoken)) s = s.replace(new RegExp(`\\b${w}s?\\b`,'gi'), ` ${v} `);
  return extractNum(s);
}

function extractNum(t) {
  const m = t.match(/-?\d+([.,]\d+)?/);
  if (m) return parseFloat(m[0].replace(',','.'));
  return null;
}

// ── ROW LOGIC ────────────────────────────────────────────────────
function startRow(posVal) {
  if (current && fldIdx > 0) saveRow(); // auto-save previous
  current = { pos: posVal, fields: [] };
  fldIdx = 0;
  appState = 'field';
  renderChips();
  renderPreview();
  toast(`Posición: ${posVal} — Di los valores`, 'i');
}

function addField(val) {
  if (!current) { toast('Di "posición <valor>" primero', 'e'); return; }
  if (fldIdx >= cfg.count) { saveRow(); return; }
  current.fields[fldIdx] = val;
  fldIdx++;
  renderPreview();
  if (fldIdx >= cfg.count) {
    toast('✅ Fila completa — Di "posición" para nueva fila', 's');
    saveRow();
  } else {
    toast(`${cfg.names[fldIdx-1]||'Campo '+(fldIdx)}: ${val}`, 'i');
  }
}

function saveRow() {
  if (!current) return;
  const r = { pos: current.pos, fields: [...current.fields] };
  while (r.fields.length < cfg.count) r.fields.push('');
  rows.push(r);
  current = null; fldIdx = 0; appState = 'idle';
  renderChips(); renderPreview(); renderTable();
}

function cancelRow(silent) {
  current = null; fldIdx = 0; appState = 'idle';
  renderChips(); renderPreview();
  if (!silent) toast('Fila cancelada', 'e');
}

function clearAll() {
  if (!rows.length && !current) return;
  if (!confirm('¿Eliminar todos los registros?')) return;
  rows = [];
  cancelRow(true);
  renderTable();
  toast('Todo eliminado', 'e');
}

function delRow(i) {
  rows.splice(i,1);
  renderTable();
  toast('Fila eliminada', 'e');
}

// ── RENDER ───────────────────────────────────────────────────────
function renderChips() {
  const el = document.getElementById('chips');
  el.innerHTML = '';
  const mkChip = (lbl, cls) => { const c=document.createElement('div'); c.className='chip '+cls; c.textContent=lbl; el.appendChild(c); };
  if (appState==='idle')  mkChip('⏸ Esperando posición','active');
  if (appState==='field') mkChip('⏸ Esperando posición','done');
  if (appState==='field') mkChip('✏️ Registrando','active');
  if (current) mkChip(`📝 ${fldIdx}/${cfg.count}`,'active');
}

function renderPreview() {
  document.getElementById('prevPos').textContent = current ? current.pos : '—';
  const g = document.getElementById('frows');
  g.innerHTML = '';
  for (let i=0; i<cfg.count; i++) {
    const div = document.createElement('div'); div.className='frow';
    const idx = document.createElement('span'); idx.className='fidx'; idx.textContent=i+1;
    const nm  = document.createElement('span'); nm.className='fnm';  nm.textContent=cfg.names[i]||`R${i+1}`;
    const val = document.createElement('span'); val.className='fval';
    if (!current)       { val.textContent='—';   val.classList.add('empty'); }
    else if (i<fldIdx)  { val.textContent=current.fields[i]??'—'; val.classList.add('filled'); }
    else if (i===fldIdx){ val.textContent='▌';   val.classList.add('cur'); }
    else                { val.textContent='···'; val.classList.add('empty'); }
    div.append(idx, nm, val);
    g.appendChild(div);
  }
}

function renderTable() {
  const head = document.getElementById('tHead');
  const body = document.getElementById('tBody');
  const tbl  = document.getElementById('tbl');
  const emp  = document.getElementById('emptyState');
  document.getElementById('badge').textContent = `${rows.length} fila${rows.length!==1?'s':''}`;

  // Header
  head.innerHTML='';
  const hr = document.createElement('tr');
  ['#','Posición',...cfg.names.slice(0,cfg.count),''].forEach(h=>{
    const th=document.createElement('th'); th.textContent=h; hr.appendChild(th);
  });
  head.appendChild(hr);

  // Body
  body.innerHTML='';
  rows.forEach((row,ri)=>{
    const tr=document.createElement('tr');
    const td0=document.createElement('td'); td0.textContent=ri+1; tr.appendChild(td0);
    const tdP=document.createElement('td'); tdP.textContent=row.pos; tr.appendChild(tdP);
    for (let i=0;i<cfg.count;i++){
      const td=document.createElement('td'); td.className='nc';
      td.textContent=row.fields[i]??''; tr.appendChild(td);
    }
    const tdD=document.createElement('td'); tdD.className='dc';
    const btn=document.createElement('button'); btn.className='del-btn'; btn.textContent='✕';
    btn.onclick=()=>delRow(ri); tdD.appendChild(btn); tr.appendChild(tdD);
    body.appendChild(tr);
  });

  tbl.style.display  = rows.length ? '' : 'none';
  emp.style.display  = rows.length ? 'none' : '';
}

// ── EXPORT ───────────────────────────────────────────────────────
function exportXLS() {
  if (!rows.length) { toast('No hay filas para exportar', 'e'); return; }
  let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:x="urn:schemas-microsoft-com:office:excel"
    xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="UTF-8">
<!--[if gte mso 9]><xml><x:ExcelWorkbook><x:ExcelWorksheets>
<x:ExcelWorksheet><x:Name>Registros</x:Name>
<x:WorksheetOptions><x:DisplayGridlines/></x:WorksheetOptions>
</x:ExcelWorksheet></x:ExcelWorksheets></x:ExcelWorkbook></xml><![endif]-->
</head><body><table border="1"><thead><tr>
<th>#</th><th>Posici&oacute;n</th>`;
  for (let i=0;i<cfg.count;i++) html+=`<th>${esc(cfg.names[i]||'R'+(i+1))}</th>`;
  html+='</tr></thead><tbody>';
  rows.forEach((row,ri)=>{
    html+=`<tr><td>${ri+1}</td><td>${esc(String(row.pos))}</td>`;
    for (let i=0;i<cfg.count;i++) html+=`<td>${esc(String(row.fields[i]??''))}</td>`;
    html+='</tr>';
  });
  html+='</tbody></table></body></html>';

  const blob=new Blob([html],{type:'application/vnd.ms-excel;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const now=new Date();
  const ts=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}`;
  a.href=url; a.download=`registros_${ts}.xls`; a.click();
  URL.revokeObjectURL(url);
  toast(`✅ Exportado: ${rows.length} filas`, 's');
}

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function pad(n){ return String(n).padStart(2,'0'); }

// ── TOAST ────────────────────────────────────────────────────────
let toastTmr;
function toast(msg, type='i'){
  const el=document.getElementById('toast');
  el.textContent=msg; el.className=`toast ${type} show`;
  clearTimeout(toastTmr);
  toastTmr=setTimeout(()=>el.classList.remove('show'),2800);
}

// ── START ────────────────────────────────────────────────────────
boot();
</script>
</body>
</html>
